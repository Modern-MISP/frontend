# === build stage ===

docs:
  needs:
    - build_image_node
  stage: build
  trigger:
    include: .gitlab/docs.yml
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

# === test stage ===

unit_tests:
  needs:
    - build_image_node
  stage: test
  script:
    - cd /app
    - npx vitest run
  coverage: /All files[^|]*\|[^|]*\|\s+([\d\.]+)/
  artifacts:
    expire_in: 1 day
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

prettier:
  needs:
    - build_image_node
  stage: test
  script:
    - cd /app
    - npx prettier --check . "!misp-docker/**"

eslint:
  needs:
    - build_image_node
  stage: test
  script:
    - cd /app
    - npx eslint --format gitlab .
  artifacts:
    expire_in: 1 day
    reports:
      codequality: gl-code-quality-report.json

svelte-check:
  allow_failure: True
  needs:
    - build_image_node
  stage: test
  script:
    - cd /app
    - npm run check

integration_tests:
  tags:
    - beefy
    - any-image-allowed
  parallel: 2
  stage: test
  image:
    name: cypress/included:13.13.2
    entrypoint: ['']
  needs:
    - build_image_node
    - build_image_nginx
  services:
    - name: registry.cert.kit.edu/public-gitlab-ci/mysql-loader:latest
      alias: db
      variables:
        MYSQL_ROOT_PASSWORD: misp
        MYSQL_DUMP_FILE: /builds/${CI_PROJECT_PATH}/misp-docker-override/dump.sql
        MYSQL_DATABASE: misp
    - name: registry.cert.kit.edu/public-gitlab-ci/misp-core:latest
      alias: misp-core
      variables:
        MYSQL_PASSWORD: misp
        MYSQL_USER: root
        DISABLE_SSL_REDIRECT: true
        ENABLE_DB_SETTINGS: 'false'
    - name: valkey/valkey:7.2
      command: ['--requirepass 1CA9kMhX6mcuhRlRAptZdQieSX6u25SJ']
      alias: redis
      variables:
        HEALTHCHECK_TCP_PORT: 6379
    - name: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_nginx:${CI_COMMIT_SHA}
      alias: frontend
      variables:
        NGINX_PORT: 81
        PUBLIC_MAINTENANCE_MODE: 'false'
        PUBLIC_MAINTENANCE_MESSAGE: Website is currently in maintenance mode. All editing is disabled.
        PUBLIC_REST_DISABLED: '{}'
        PUBLIC_REST_DISABLED_MESSAGE: The REST method you try to use is disabled
        PUBLIC_MISP_API_ENDPOINT: https://misp-core
        PUBLIC_DATE_FORMAT: yyyy-mm-DD
        PUBLIC_COMPATIBILITY_MODE: 'true'
  script:
    # Create environment files
    - mv misp-docker-override/dump01.sql misp-docker-override/dump.sql
    - npm ci
    - while [ ! -f "$MISP_READY_FILE" ]; do sleep 10; done
    - npx cypress run --parallel --record --ci-build-id=${CI_PIPELINE_ID}_legacy --browser chrome --reporter junit --reporter-options mochaFile=reports/report-[hash].xml
  variables:
    CYPRESS_BASE_URL: http://frontend:81
    CYPRESS_VIDEO: 'true'
    ELECTRON_ENABLE_LOGGING: 'true'
    REDIS_PASSWORD: 1CA9kMhX6mcuhRlRAptZdQieSX6u25SJ
    MISP_READY_FILE: '${CI_PROJECT_DIR}/misp_ready'
    CYPRESS_adminToken: '${MISP01_AUTH_TOKEN}'
    CYPRESS_legacy: 'true'
  artifacts:
    expire_in: 1 day
    reports:
      junit: reports/report-*.xml
    expose_as: Cypress artifacts
    when: always
    paths:
      - cypress/screenshots/
      - cypress/videos/

integration_tests_new_api:
  tags:
    - beefy
    - any-image-allowed
  parallel: 2
  stage: test
  image:
    name: cypress/included:13.13.2
    entrypoint: ['']
  needs:
    - build_image_node
    - build_image_nginx
  services:
    - name: registry.cert.kit.edu/public-gitlab-ci/mysql-loader:latest
      alias: db
      variables:
        MYSQL_ROOT_PASSWORD: misp
        MYSQL_DUMP_FILE: /builds/${CI_PROJECT_PATH}/misp-docker-override/dump.sql
        MYSQL_DATABASE: misp
    - name: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/api:main
      alias: new_api
      variables:
        DATABASE_URL: 'mysql+aiomysql://root:misp@db:3306/misp'
        WORKER_KEY: EU81IOLWsn8g37gK7xWToiQpUvYXdPDs
        WORKER_URL: http://worker-api:5000
        DEBUG: true
    - name: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/worker:main
      alias: worker-api
      variables:
        MMISP_REDIS_HOST: redis
        MMISP_DB_API_URL: 'http://new_api:4000'
        MMISP_API_KEY: EU81IOLWsn8g37gK7xWToiQpUvYXdPDs
        DATABASE_URL: 'mysql+aiomysql://root:misp@db:3306/misp'
    - name: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/worker:main
      command: ['mmisp-worker']
      alias: worker
      variables:
        MMISP_REDIS_HOST: redis
        MMISP_DB_API_URL: 'http://new_api:4000'
        MMISP_API_KEY: EU81IOLWsn8g37gK7xWToiQpUvYXdPDs
        DATABASE_URL: 'mysql+aiomysql://root:misp@db:3306/misp'
    - name: valkey/valkey:7.2
      command: ['--requirepass 1CA9kMhX6mcuhRlRAptZdQieSX6u25SJ']
      alias: redis
      variables:
        HEALTHCHECK_TCP_PORT: 6379
    - name: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_nginx:${CI_COMMIT_SHA}
      alias: frontend
      variables:
        NGINX_PORT: 81
        PUBLIC_MAINTENANCE_MODE: 'false'
        PUBLIC_MAINTENANCE_MESSAGE: Website is currently in maintenance mode. All editing is disabled.
        PUBLIC_REST_DISABLED: '{}'
        PUBLIC_REST_DISABLED_MESSAGE: The REST method you try to use is disabled
        PUBLIC_MISP_API_ENDPOINT: http://new_api:4000
        PUBLIC_DATE_FORMAT: yyyy-mm-DD
        PUBLIC_COMPATIBILITY_MODE: 'false'
  script:
    # Create environment files
    - mv misp-docker-override/dump01.sql misp-docker-override/dump.sql
    - npm ci
    - until wget -q -t1 http://new_api:4000; do rc="$?"; if [ $rc -eq 0 ] || [ $rc -eq 8 ]; then echo "MMISP API is ready"; break; else sleep 1; fi; done
    - npx cypress run --parallel --record --ci-build-id=${CI_PIPELINE_ID}_modern --browser chrome --reporter junit --reporter-options mochaFile=reports/report-[hash].xml
  variables:
    CYPRESS_BASE_URL: http://frontend:81
    CYPRESS_VIDEO: 'true'
    ELECTRON_ENABLE_LOGGING: 'true'
    MISP_READY_FILE: '${CI_PROJECT_DIR}/misp_ready'
    MMISP_REDIS_PASSWORD: 1CA9kMhX6mcuhRlRAptZdQieSX6u25SJ
    REDIS_PASSWORD: 1CA9kMhX6mcuhRlRAptZdQieSX6u25SJ
    CYPRESS_adminToken: '${MISP01_AUTH_TOKEN}'
    CYPRESS_legacy: 'false'
    #    CI_DEBUG_SERVICES: "true"
  artifacts:
    expire_in: 1 day
    reports:
      junit: reports/report-*.xml
    expose_as: Cypress artifacts
    when: always
    paths:
      - cypress/screenshots/
      - cypress/videos/
