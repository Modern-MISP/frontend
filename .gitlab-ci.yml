stages:
  - build_image
  - pre-build
  - build
  - test
  - deploy

default:
  tags:
    - kgr1-instance-standard
  image:
    name: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_node:${CI_COMMIT_SHA}
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "docs"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

# build image stage

build_image_node:
  needs: []
  before_script: []
  stage: build_image
  tags:
    - kgr1-instance-standard
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - >-
      echo '{"auths":{"https://registry.cert.kit.edu/v2/":{"auth": "'$(echo -n ${REGISTRY_USER}:${REGISTRY_PASSWORD} | base64 -w 0)'" }}}' > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.node"
      --destination ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_node:${CI_COMMIT_BRANCH}
      --destination ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_node:${CI_COMMIT_SHA}

build_image_nginx:
  needs:
    - build_image_node
  before_script: []
  stage: build_image
  tags:
    - kgr1-instance-standard
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - >-
      echo '{"auths":{"https://registry.cert.kit.edu/v2/":{"auth": "'$(echo -n ${REGISTRY_USER}:${REGISTRY_PASSWORD} | base64 -w 0)'" }}}' > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.nginx"
      --build-arg fromimage=${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_node
      --build-arg fromtag=$CI_COMMIT_SHA
      --destination ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_nginx:${CI_COMMIT_BRANCH}
      --destination ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/frontend_nginx:${CI_COMMIT_SHA}

